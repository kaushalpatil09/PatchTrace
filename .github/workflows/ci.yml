name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node-${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Local check
        run: npm run check
      - name: Security audit (npm registry advisory data)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run security

  docker:
    name: Docker build / runtime (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag patchtrace:ci .
      - name: Start container and verify readiness
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm --name patchtrace-ci \
            --health-interval=5s \
            --health-start-period=5s \
            --health-retries=3 \
            -p 127.0.0.1:4173:4173 \
            patchtrace:ci)"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
            if [[ "$state" != "running" ]]; then
              if [[ "$state" == "exited" || "$state" == "dead" || -z "$state" ]]; then
                echo "Container is not running (state: ${state:-missing})."
                docker logs "$container_id" || true
                exit 1
              fi
            elif curl --fail --silent --max-time 2 http://127.0.0.1:4173/api/health 2>/dev/null \
              | grep -q '"ready":true'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            echo "Container did not become API-ready."
            docker logs "$container_id" || true
            exit 1
          fi

          health=""
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" ]]; then
              docker logs "$container_id" || true
              exit 1
            fi
            sleep 1
          done
          test "$health" = healthy
          test "$(docker exec "$container_id" id -u)" != 0
