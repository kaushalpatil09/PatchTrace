<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">PatchTrace incident-to-change analysis overview</title>
  <desc id="desc">A dark, cyan and amber project graphic showing an incident timeline flowing into an evidence-backed suspect ranking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="0.62" stop-color="#101d26"/>
      <stop offset="1" stop-color="#18252c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172630" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0c151d" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" x2="1">
      <stop offset="0" stop-color="#57d4c7" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#57d4c7"/>
      <stop offset="1" stop-color="#57d4c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="-20" r="300" fill="#57d4c7" opacity="0.06"/>
  <circle cx="80" cy="610" r="260" fill="#ffbd69" opacity="0.045"/>
  <path d="M54 498 C360 400 468 540 720 446 S1160 280 1540 350" fill="none" stroke="url(#cyanLine)" stroke-width="2" opacity="0.6"/>

  <g transform="translate(76 72)">
    <rect width="56" height="56" rx="14" fill="#111c24" stroke="#57d4c7" stroke-width="2"/>
    <text x="28" y="38" text-anchor="middle" fill="#57d4c7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="800">P</text>
    <text x="78" y="19" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="3">LOCAL INCIDENT ANALYSIS</text>
    <text x="78" y="55" fill="#edf4f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="800">PATCHTRACE</text>
  </g>

  <g transform="translate(76 194)">
    <text x="0" y="0" fill="#57d4c7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="3">INCIDENT → CHANGE</text>
    <text x="0" y="68" fill="#edf4f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="54" font-weight="800">Find the change</text>
    <text x="0" y="128" fill="#edf4f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="54" font-weight="800">worth investigating first.</text>
    <text x="0" y="178" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20">Deterministic timelines, inspectable evidence, and</text>
    <text x="0" y="208" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20">opt-in rollback hypothesis checks — kept local.</text>

    <g transform="translate(0 258)">
      <rect width="142" height="34" rx="17" fill="#13262a" stroke="#315c5d"/>
      <circle cx="19" cy="17" r="5" fill="#57d4c7" filter="url(#glow)"/>
      <text x="34" y="22" fill="#b9e9e4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">LOCAL-FIRST</text>
      <rect x="154" width="146" height="34" rx="17" fill="#201e1a" stroke="#6c5737"/>
      <circle cx="173" cy="17" r="5" fill="#ffbd69"/>
      <text x="188" y="22" fill="#ffe0a8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">EVIDENCE-FIRST</text>
      <rect x="312" width="120" height="34" rx="17" fill="#13262a" stroke="#315c5d"/>
      <text x="372" y="22" text-anchor="middle" fill="#b9e9e4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">READ-ONLY</text>
    </g>
  </g>

  <g transform="translate(870 72)">
    <rect width="650" height="450" rx="22" fill="url(#panel)" stroke="#2c3b47" stroke-width="2"/>
    <text x="34" y="42" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="2">SAMPLE INVESTIGATION · PRODUCTION</text>
    <text x="34" y="78" fill="#edf4f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800">VAT calculation errors after deployment</text>
    <text x="34" y="108" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Timeline → ranked suspects → evidence details</text>

    <g transform="translate(34 140)">
      <line x1="18" y1="4" x2="18" y2="126" stroke="#2c3b47" stroke-width="2"/>
      <circle cx="18" cy="10" r="7" fill="#111c24" stroke="#57d4c7" stroke-width="3"/>
      <circle cx="18" cy="64" r="7" fill="#111c24" stroke="#57d4c7" stroke-width="3"/>
      <circle cx="18" cy="118" r="7" fill="#111c24" stroke="#ffbd69" stroke-width="3"/>
      <text x="42" y="13" fill="#edf4f8" font-family="ui-monospace,monospace" font-size="12">13:55 UTC · commit a81e7c2</text>
      <text x="42" y="31" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Simplify VAT exemption calculation</text>
      <text x="42" y="67" fill="#edf4f8" font-family="ui-monospace,monospace" font-size="12">14:00 UTC · production deployment</text>
      <text x="42" y="85" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Commit a81e7c2 reached production</text>
      <text x="42" y="121" fill="#edf4f8" font-family="ui-monospace,monospace" font-size="12">14:09 UTC · VAT error rate increased</text>
      <text x="42" y="139" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">EU checkout errors crossed the alert threshold</text>
    </g>

    <g transform="translate(34 310)">
      <rect width="582" height="94" rx="14" fill="#102522" stroke="#57d4c7" stroke-width="2"/>
      <text x="20" y="27" fill="#57d4c7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">01 · TOP SUSPECT</text>
      <text x="20" y="55" fill="#edf4f8" font-family="ui-monospace,monospace" font-size="18" font-weight="800">a81e7c2</text>
      <text x="112" y="55" fill="#edf4f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">score 0.76</text>
      <text x="112" y="76" fill="#b9e9e4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">high confidence · 100% coverage</text>
      <text x="390" y="55" fill="#ffbd69" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">5 signals</text>
      <text x="390" y="76" fill="#8ea0ad" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">deployment · files · test · risk · deps</text>
    </g>
  </g>

  <text x="76" y="570" fill="#62717c" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" letter-spacing="1.5">TIMELINE  •  EVIDENCE  •  PROVENANCE  •  ROLLBACK HYPOTHESIS</text>
</svg>
