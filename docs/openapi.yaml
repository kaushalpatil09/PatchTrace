openapi: 3.1.0
info:
  title: PatchTrace local API
  version: 1.0.0
  description: |
    Local-first incident-to-change analysis API. Every JSON response includes
    apiVersion: 1. The API is intended for a single local user and does not
    provide CORS or multi-user account management.
servers:
  - url: http://127.0.0.1:4173
    description: Default loopback listener
security:
  - bearerAuth: []
  - patchtraceToken: []
  - sessionCookie: []
paths:
  /:
    get:
      operationId: getUi
      summary: Serve the browser UI
      description: Sets the HttpOnly PatchTrace session cookie used by the browser UI.
      security: []
      responses:
        '200':
          description: HTML browser application.
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /index.html:
    get:
      operationId: redirectUi
      summary: Redirect to the browser UI
      security: []
      responses:
        '302':
          description: Redirect to /.
          headers:
            Location:
              schema:
                type: string
                const: /
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/health:
    get:
      operationId: getHealth
      summary: Read local readiness information
      description: Public host-checked health information. The response never contains the session token.
      security: []
      responses:
        '200':
          description: Health response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/sample:
    get:
      operationId: getSample
      summary: Load the deterministic incident fixture
      description: Requires authentication and returns the server-owned sample incident bundle.
      responses:
        '200':
          description: Incident fixture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/analyze:
    post:
      operationId: analyzeIncident
      summary: Analyze an incident bundle
      description: |
        The request body is the incident bundle itself, not a wrapper. The request limit is 5 MiB.
        Raw analysis is sensitive and is not redacted. One analysis is admitted at a time,
        with no queue. A worker has a 5 second execution budget and 128 MiB V8 old heap limit.
        Work is limited to 250000 changed/related path references and 50000000 overlap visits.
        Analysis output is limited to 16 MiB; related-test detail lists are capped at 20 per suspect,
        with full counts and explicit truncation metadata. Scores use every matching test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentBundle'
      responses:
        '200':
          description: Deterministic ranked analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '400':
          description: Invalid JSON or incident bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: analysis_limit - computational or output budget exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: analysis_busy, analysis_timeout, analysis_cancelled or analysis_failed. No automatic queue or retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/report:
    post:
      operationId: buildReport
      summary: Build a redacted report
      description: |
        Builds JSON report metadata from an analysis and optional verification result.
        JSON, Markdown, and CSV renderers apply secret redaction and replace absolute
        POSIX, Windows drive, UNC, and home-directory paths with [path redacted].
        Repository-relative evidence paths such as src/tax.ts remain intact.
        The request limit is 5 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: Versioned redacted report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: Invalid JSON or report request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/verify:
    post:
      operationId: verifyRollbackHypothesis
      summary: Verify a rollback hypothesis
      description: |
        The same route supports two explicit modes. A fixture request uses the
        server-owned fixture verification result and never executes a repository.
        A live request includes repoPath and is available only when the server was
        started with PATCHTRACE_ENABLE_VERIFY=1. Live verification runs in the
        configured isolation mode and returns source: live; fixture verification
        returns source: fixture. The request limit is 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Fixture or live verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Invalid request or repository verification error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Host/origin rejection or live verification disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Verification is already running or was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/verify/cancel:
    post:
      operationId: cancelVerification
      summary: Cancel the active live verification
      description: Accepts an empty body or an empty JSON object. It never cancels fixture verification.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Invalid cancellation body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No live verification is currently active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PatchTrace session token
      description: Token printed at server startup or supplied through PATCHTRACE_TOKEN.
    patchtraceToken:
      type: apiKey
      in: header
      name: X-PatchTrace-Token
    sessionCookie:
      type: apiKey
      in: cookie
      name: patchtrace_session
  responses:
    Unauthorized:
      description: Missing or invalid PatchTrace session token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Host/origin rejection or a disabled operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BodyTooLarge:
      description: Request body exceeds the route limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Request body is not application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server or response-contract error without a stack trace or filesystem path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorDetail:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string
      additionalProperties: false
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
        details:
          description: Optional field-level validation details. Absolute paths are scrubbed.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            - type: object
            - type: string
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [apiVersion, error]
      properties:
        apiVersion:
          const: 1
        error:
          $ref: '#/components/schemas/ApiError'
      additionalProperties: false
    IncidentBundle:
      type: object
      required: [schemaVersion, title, environment, incidentStart, commits]
      properties:
        schemaVersion:
          const: 1
        title:
          type: string
          minLength: 1
        summary:
          type: string
        environment:
          type: string
          minLength: 1
        incidentStart:
          $ref: '#/components/schemas/Timestamp'
        incidentEnd:
          $ref: '#/components/schemas/Timestamp'
        candidateWindowMinutes:
          type: number
          exclusiveMinimum: 0
        incidentFiles:
          type: array
          items:
            type: string
            minLength: 1
        commits:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/Commit'
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        tests:
          type: array
          items:
            $ref: '#/components/schemas/TestResult'
        incidentEvents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEvent'
        verification:
          type: object
          description: Optional server-owned fixture verification keyed by candidate SHA.
          additionalProperties:
            type: object
        provenance:
          type: object
          description: Ingestion metadata. Report exports scrub absolute paths.
          additionalProperties: true
      additionalProperties: true
    Timestamp:
      type: string
      description: ISO 8601 timestamp with an explicit timezone.
      pattern: '(Z|[+-][0-9]{2}:?[0-9]{2})$'
    Sha:
      type: string
      pattern: '^[0-9a-fA-F]{4,64}$'
    Commit:
      type: object
      required: [sha, timestamp, message]
      properties:
        sha:
          $ref: '#/components/schemas/Sha'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        message:
          type: string
          minLength: 1
        changedFiles:
          type: array
          items:
            type: string
            minLength: 1
        diffRisk:
          type: number
          minimum: 0
          maximum: 1
        dependencyImpact:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: true
    Deployment:
      type: object
      required: [timestamp, environment]
      properties:
        commitSha:
          $ref: '#/components/schemas/Sha'
        commitShas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Sha'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        environment:
          type: string
          minLength: 1
      anyOf:
        - required: [commitSha]
        - required: [commitShas]
      additionalProperties: true
    TestResult:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum: [passed, failed, skipped]
        relatedFiles:
          type: array
          items:
            type: string
        errorSignature:
          type: string
      additionalProperties: true
    IncidentEvent:
      type: object
      required: [kind, timestamp, title]
      properties:
        kind:
          type: string
          minLength: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        title:
          type: string
          minLength: 1
        detail:
          type: string
        commitSha:
          $ref: '#/components/schemas/Sha'
      additionalProperties: true
    AnalysisIncident:
      type: object
      required: [title, environment, incidentStart]
      properties:
        title:
          type: string
        summary:
          type: string
        incidentStart:
          $ref: '#/components/schemas/Timestamp'
        incidentEnd:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        environment:
          type: string
      additionalProperties: true
    Suspect:
      type: object
      required: [sha, message, timestamp, score, confidence, factors, contributions, coverage, signalAvailability, signalSources, signalDetails, missingSignals, evidence]
      properties:
        sha:
          $ref: '#/components/schemas/Sha'
        message:
          type: string
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        score:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: string
          enum: [high, medium, low]
        factors:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        contributions:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        coverage:
          type: number
          minimum: 0
          maximum: 1
        signalAvailability:
          type: object
          additionalProperties:
            type: boolean
        signalSources:
          type: object
          additionalProperties:
            type: string
        signalDetails:
          type: object
          additionalProperties: true
        missingSignals:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    Analysis:
      type: object
      required: [schemaVersion, incident, timeline, suspects, weights, candidateWindowMinutes, excludedCandidateCount, warnings, verification]
      properties:
        schemaVersion:
          const: 1
        incident:
          $ref: '#/components/schemas/AnalysisIncident'
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        suspects:
          type: array
          items:
            $ref: '#/components/schemas/Suspect'
        weights:
          type: object
          additionalProperties:
            type: number
        candidateWindowMinutes:
          type: number
          exclusiveMinimum: 0
        excludedCandidateCount:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
        verification:
          type: object
          additionalProperties: true
      additionalProperties: true
    ApiVersion:
      type: object
      required: [apiVersion]
      properties:
        apiVersion:
          const: 1
    SampleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - $ref: '#/components/schemas/IncidentBundle'
    AnalysisResponse:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - $ref: '#/components/schemas/Analysis'
    ReportRequest:
      type: object
      required: [analysis]
      properties:
        analysis:
          $ref: '#/components/schemas/Analysis'
        verification:
          oneOf:
            - type: object
            - type: 'null'
        provenance:
          type: object
          additionalProperties: true
      additionalProperties: false
    RedactionMetadata:
      type: object
      required: [applied, matches]
      properties:
        applied:
          type: boolean
          const: true
        matches:
          type: integer
          minimum: 0
        pathsScrubbed:
          type: integer
          minimum: 0
          description: Count of absolute or home-directory path replacements.
      additionalProperties: false
    Report:
      type: object
      required: [schemaVersion, generatedAt, toolVersion, analysis, verification, provenance, redaction]
      properties:
        schemaVersion:
          const: 1
        generatedAt:
          type: string
          format: date-time
        toolVersion:
          type: string
        analysis:
          $ref: '#/components/schemas/Analysis'
        verification:
          oneOf:
            - type: object
            - type: 'null'
        provenance:
          type: object
          description: Deep-redacted report metadata. Absolute paths are replaced; repository-relative evidence paths are preserved.
          additionalProperties: true
        redaction:
          $ref: '#/components/schemas/RedactionMetadata'
      additionalProperties: false
    ReportResponse:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - $ref: '#/components/schemas/Report'
    FixtureVerificationRequest:
      type: object
      required: [analysis, sha]
      properties:
        analysis:
          $ref: '#/components/schemas/Analysis'
        sha:
          $ref: '#/components/schemas/Sha'
      additionalProperties: false
      description: Fixture mode. The server ignores client-supplied analysis.verification and reads its own fixture.
    LiveVerificationRequest:
      type: object
      required: [repoPath, sha]
      properties:
        repoPath:
          type: string
          minLength: 1
          description: Local Git worktree path. It is never included in API error messages without scrubbing.
        sha:
          $ref: '#/components/schemas/Sha'
        testCommand:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        timeoutMs:
          type: number
          minimum: 1
          maximum: 600000
        mainline:
          type: integer
          minimum: 1
      additionalProperties: false
      description: Live mode. Enabled only with PATCHTRACE_ENABLE_VERIFY=1.
    VerifyRequest:
      oneOf:
        - $ref: '#/components/schemas/FixtureVerificationRequest'
        - $ref: '#/components/schemas/LiveVerificationRequest'
      description: Exactly one of fixture or live verification mode.
    VerificationResult:
      type: object
      required: [status, source]
      properties:
        status:
          type: string
        source:
          type: string
          enum: [fixture, live]
        outcome:
          type: string
        reason:
          type: string
        message:
          type: string
        baseline:
          oneOf:
            - type: object
            - type: 'null'
        candidate:
          oneOf:
            - type: object
            - type: 'null'
        sourceUnchanged:
          type: boolean
        cleanup:
          type: object
          additionalProperties: true
      additionalProperties: true
    VerificationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - $ref: '#/components/schemas/VerificationResult'
    CancelResponse:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - type: object
          required: [cancelled]
          properties:
            cancelled:
              const: true
          additionalProperties: false
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - type: object
          required: [status, ready, version, node, platform, git, tempWritable, realVerificationEnabled, verificationInProgress]
          properties:
            status:
              type: string
              enum: [ok, degraded]
            ready:
              type: boolean
            version:
              type: string
            node:
              type: string
            platform:
              type: string
            git:
              type: object
              required: [available, version]
              properties:
                available:
                  type: boolean
                version:
                  oneOf:
                    - type: string
                    - type: 'null'
              additionalProperties: false
            tempWritable:
              type: boolean
            realVerificationEnabled:
              type: boolean
            verificationInProgress:
              type: boolean
          additionalProperties: false
